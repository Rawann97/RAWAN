version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_final_storage:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fastapi_backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./Data:/app/Data
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    container_name: streamlit_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  pg_final_storage: